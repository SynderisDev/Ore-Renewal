plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def generatedGameTestResources = layout.buildDirectory.dir('generated/gameTestResources')
def generateGameTestStructures = tasks.register('generateGameTestStructures') {
    def encodedStructure = layout.projectDirectory.file('src/gametest/templates/empty3x3x3.nbt.base64')
    def generatedStructure = generatedGameTestResources.map {
        it.file("data/${mod_id}/structure/empty3x3x3.nbt")
    }

    inputs.file(encodedStructure)
    outputs.file(generatedStructure)

    doLast {
        def outputFile = generatedStructure.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.bytes = Base64.decoder.decode(encodedStructure.asFile.text.trim())
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }

    gameTest {
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        resources.srcDir generatedGameTestResources
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }

    scenarioTest {
        java.setSrcDirs(['src/scenarioTest/java'])
        resources.setSrcDirs(['src/scenarioTest/resources'])
        resources.srcDir generatedGameTestResources
    }

    fixtureOreA {
        java.setSrcDirs([])
        resources.setSrcDirs(['src/fixtureOreA/resources'])
    }

    fixtureOreB {
        java.setSrcDirs([])
        resources.setSrcDirs(['src/fixtureOreB/resources'])
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_gametest" {
            sourceSet(sourceSets.gameTest)
        }
        ore_renewal_scenario_tests {
            sourceSet(sourceSets.scenarioTest)
        }
        ore_renewal_fixture_a {
            sourceSet(sourceSets.fixtureOreA)
        }
        ore_renewal_fixture_b {
            sourceSet(sourceSets.fixtureOreB)
        }
    }

    addModdingDependenciesTo sourceSets.gameTest
    addModdingDependenciesTo sourceSets.scenarioTest
    addModdingDependenciesTo sourceSets.fixtureOreA
    addModdingDependenciesTo sourceSets.fixtureOreB

    unitTest {
        enable()
        testedMod = mods.getByName(project.mod_id)
        loadedMods = [mods.getByName(project.mod_id)]
    }

    runs {
        client {
            client()
            loadedMods = [mods.getByName(project.mod_id)]
        }

        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods.getByName(project.mod_id)]
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-gametest').get().asFile
            sourceSet = sourceSets.gameTest
            loadedMods = [
                    mods.getByName(project.mod_id),
                    mods.getByName("${project.mod_id}_gametest")
            ]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        scenarioAFreshWithOreRenewal {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-a').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [mods.getByName(project.mod_id), mods.ore_renewal_scenario_tests]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'A0'
        }

        scenarioAAddFixtureA {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-a').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [
                    mods.getByName(project.mod_id),
                    mods.ore_renewal_scenario_tests,
                    mods.ore_renewal_fixture_a
            ]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'A1'
        }

        scenarioAGeneratePostModChunk {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-a').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [
                    mods.getByName(project.mod_id),
                    mods.ore_renewal_scenario_tests,
                    mods.ore_renewal_fixture_a
            ]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'A2'
        }

        scenarioAAddFixtureB {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-a').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [
                    mods.getByName(project.mod_id),
                    mods.ore_renewal_scenario_tests,
                    mods.ore_renewal_fixture_a,
                    mods.ore_renewal_fixture_b
            ]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'A3'
        }

        scenarioARestart {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-a').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [
                    mods.getByName(project.mod_id),
                    mods.ore_renewal_scenario_tests,
                    mods.ore_renewal_fixture_a,
                    mods.ore_renewal_fixture_b
            ]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'A4'
        }

        scenarioBCreateExistingWorld {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-b').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [mods.ore_renewal_scenario_tests]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'B0'
        }

        scenarioBAddOreRenewal {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-b').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [mods.getByName(project.mod_id), mods.ore_renewal_scenario_tests]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'B1'
        }

        scenarioBAddFixtureA {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-b').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [
                    mods.getByName(project.mod_id),
                    mods.ore_renewal_scenario_tests,
                    mods.ore_renewal_fixture_a
            ]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'B2'
        }

        scenarioBRestart {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-b').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [
                    mods.getByName(project.mod_id),
                    mods.ore_renewal_scenario_tests,
                    mods.ore_renewal_fixture_a
            ]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'B3'
        }

        scenarioCCreateExistingWorld {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-c').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [mods.ore_renewal_scenario_tests]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'C0'
        }

        scenarioCAddFixtureA {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-c').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [mods.ore_renewal_scenario_tests, mods.ore_renewal_fixture_a]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'C1'
        }

        scenarioCAddFixtureB {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-c').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [
                    mods.ore_renewal_scenario_tests,
                    mods.ore_renewal_fixture_a,
                    mods.ore_renewal_fixture_b
            ]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'C2'
        }

        scenarioCAddOreRenewal {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-c').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [
                    mods.getByName(project.mod_id),
                    mods.ore_renewal_scenario_tests,
                    mods.ore_renewal_fixture_a,
                    mods.ore_renewal_fixture_b
            ]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'C3'
        }

        scenarioCRestart {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('run-lifecycle/scenario-c').get().asFile
            sourceSet = sourceSets.scenarioTest
            loadedMods = [
                    mods.getByName(project.mod_id),
                    mods.ore_renewal_scenario_tests,
                    mods.ore_renewal_fixture_a,
                    mods.ore_renewal_fixture_b
            ]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'oreRenewal.lifecycle.phase', 'C4'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('processGameTestResources').configure {
    dependsOn generateGameTestStructures
}

tasks.named('processScenarioTestResources').configure {
    dependsOn generateGameTestStructures
}

def cleanGameTestRun = tasks.register('cleanGameTestRun', Delete) {
    delete layout.buildDirectory.dir('run-gametest')
}

tasks.named('runGameTestServer').configure {
    dependsOn cleanGameTestRun
}

def cleanLifecycleWorlds = tasks.register('cleanLifecycleWorlds', Delete) {
    delete layout.buildDirectory.dir('run-lifecycle')
}

def scenarioA0 = tasks.named('runScenarioAFreshWithOreRenewal')
def scenarioA1 = tasks.named('runScenarioAAddFixtureA')
def scenarioA2 = tasks.named('runScenarioAGeneratePostModChunk')
def scenarioA3 = tasks.named('runScenarioAAddFixtureB')
def scenarioA4 = tasks.named('runScenarioARestart')
def scenarioB0 = tasks.named('runScenarioBCreateExistingWorld')
def scenarioB1 = tasks.named('runScenarioBAddOreRenewal')
def scenarioB2 = tasks.named('runScenarioBAddFixtureA')
def scenarioB3 = tasks.named('runScenarioBRestart')
def scenarioC0 = tasks.named('runScenarioCCreateExistingWorld')
def scenarioC1 = tasks.named('runScenarioCAddFixtureA')
def scenarioC2 = tasks.named('runScenarioCAddFixtureB')
def scenarioC3 = tasks.named('runScenarioCAddOreRenewal')
def scenarioC4 = tasks.named('runScenarioCRestart')

def verifyLifecyclePhase = { taskProvider, scenario, phase ->
    def completion = layout.buildDirectory.file(
            "run-lifecycle/scenario-${scenario}/lifecycle-${phase}.complete")
    taskProvider.configure {
        doFirst {
            completion.get().asFile.delete()
        }
        doLast {
            def completionFile = completion.get().asFile
            if (!completionFile.isFile() || completionFile.getText('UTF-8').trim() != phase) {
                throw new GradleException(
                        "Lifecycle phase ${phase} exited without running its required GameTest")
            }
        }
    }
}

verifyLifecyclePhase(scenarioA0, 'a', 'A0')
verifyLifecyclePhase(scenarioA1, 'a', 'A1')
verifyLifecyclePhase(scenarioA2, 'a', 'A2')
verifyLifecyclePhase(scenarioA3, 'a', 'A3')
verifyLifecyclePhase(scenarioA4, 'a', 'A4')
verifyLifecyclePhase(scenarioB0, 'b', 'B0')
verifyLifecyclePhase(scenarioB1, 'b', 'B1')
verifyLifecyclePhase(scenarioB2, 'b', 'B2')
verifyLifecyclePhase(scenarioB3, 'b', 'B3')
verifyLifecyclePhase(scenarioC0, 'c', 'C0')
verifyLifecyclePhase(scenarioC1, 'c', 'C1')
verifyLifecyclePhase(scenarioC2, 'c', 'C2')
verifyLifecyclePhase(scenarioC3, 'c', 'C3')
verifyLifecyclePhase(scenarioC4, 'c', 'C4')

scenarioA0.configure { dependsOn cleanLifecycleWorlds }
scenarioA1.configure { dependsOn scenarioA0 }
scenarioA2.configure { dependsOn scenarioA1 }
scenarioA3.configure { dependsOn scenarioA2 }
scenarioA4.configure { dependsOn scenarioA3 }
scenarioB0.configure { dependsOn cleanLifecycleWorlds }
scenarioB1.configure { dependsOn scenarioB0 }
scenarioB2.configure { dependsOn scenarioB1 }
scenarioB3.configure { dependsOn scenarioB2 }
scenarioC0.configure { dependsOn cleanLifecycleWorlds }
scenarioC1.configure { dependsOn scenarioC0 }
scenarioC2.configure { dependsOn scenarioC1 }
scenarioC3.configure { dependsOn scenarioC2 }
scenarioC4.configure { dependsOn scenarioC3 }

def lifecycleGameTest = tasks.register('lifecycleGameTest') {
    group = 'verification'
    description = 'Runs persisted-world, multi-restart Ore Renewal lifecycle scenarios.'
    dependsOn scenarioA4, scenarioB3, scenarioC4
}

tasks.register('headlessCi') {
    group = 'verification'
    description = 'Runs every client-free verification task used by CI.'
    dependsOn tasks.named('check'), tasks.named('runGameTestServer'), lifecycleGameTest
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
