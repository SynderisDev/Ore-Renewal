name: Headless tests

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: headless-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM and NeoForge GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM tests and build
        run: ./gradlew --no-daemon --stacktrace build

      - name: Run headless NeoForge GameTests
        timeout-minutes: 15
        run: ./gradlew --no-daemon --stacktrace runGameTestServer

      - name: Run persisted-world lifecycle scenarios
        timeout-minutes: 25
        run: ./gradlew --no-daemon --no-parallel --max-workers=1 --stacktrace lifecycleGameTest

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-test-diagnostics
          if-no-files-found: ignore
          path: |
            build/reports/tests/
            build/test-results/
            build/run-gametest/logs/
            build/run-gametest/crash-reports/
            build/run-lifecycle/**/logs/
            build/run-lifecycle/**/crash-reports/
